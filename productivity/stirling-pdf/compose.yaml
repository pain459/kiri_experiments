name: kiri-stirling

# PDF toolbox: merge, split, OCR, compress, sign. Host port 8081 because
# 8080 is taken by the smoke stack.
#
# Tessdata is intentionally not bind-mounted: an empty directory over it would
# silently break OCR. Mount ./data/tessdata only after copying real data into it.
services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    ports:
      - "8081:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      LANGS: en_GB,de_DE
    volumes:
      - ./data/configs:/configs
      - ./data/logs:/logs
      - ./data/pipeline:/pipeline
    networks:
      - stirling
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/info/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

networks:
  stirling:
    driver: bridge
