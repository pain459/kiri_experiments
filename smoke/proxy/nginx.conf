server {
    listen 80;
    server_name _;

    # Answered by the proxy itself, so a healthy proxy is provable
    # even if the upstream app is down.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "proxy ok\n";
    }

    # Echo which upstream container served the request; useful when
    # validating service discovery inside the compose network.
    location /upstream {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "smoke-app\n";
    }

    location / {
        proxy_pass http://app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
