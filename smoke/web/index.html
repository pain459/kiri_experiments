<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kiri smoke test</title>
  <style>
    :root { color-scheme: dark }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0b0d12; color: #e6e8ee;
    }
    main { max-width: 40rem; padding: 2rem }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem }
    p { color: #9aa3b2; margin: 0 0 1.5rem }
    code { background: #171b24; padding: .15em .4em; border-radius: 4px; color: #a5d6ff }
    ul { padding-left: 1.1rem }
    li { margin: .35rem 0 }
    .ok { color: #7ee787 }
  </style>
</head>
<body>
  <main>
    <h1>kiri smoke test <span class="ok">up</span></h1>
    <p>This page is served by <code>smoke-app</code> and proxied by <code>smoke-proxy</code>.</p>
    <ul>
      <li><code>/</code> — this page (proxy &rarr; app)</li>
      <li><code>/healthz</code> — proxy health, answered locally</li>
      <li><code>/upstream</code> — which upstream container responded</li>
    </ul>
  </main>
</body>
</html>
